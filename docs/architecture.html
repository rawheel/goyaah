<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goyaah architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #141414; }
  body { width: 1400px; }
  svg { display: block; }
  text { font-family: Archivo, system-ui, sans-serif; fill: #f2efe9; }
  .marker { font-family: 'Permanent Marker', Archivo, sans-serif; }
  .h { font-weight: 800; font-size: 30px; letter-spacing: -0.01em; }
  .T { font-weight: 800; font-size: 28px; letter-spacing: -0.01em; }
  .t { font-weight: 600; font-size: 22px; }
  .s { font-weight: 400; font-size: 17px; fill: #9d9890; }
  .c { font-weight: 500; font-size: 18px; fill: #d6d2cb; }
  .k { font-weight: 400; font-size: 19px; fill: #141414; }
  .box { fill: #1c1c1c; stroke: #5a5955; stroke-width: 1.5; }
  .big { fill: #181818; stroke: #8a8984; stroke-width: 2; }
  .band { fill: #242424; stroke: #4a4946; stroke-width: 1.2; }
  .band.on { fill: #ff5a36; stroke: #ff5a36; }
  .line { stroke: #d6d2cb; stroke-width: 1.8; fill: none; }
  .dash { stroke: #9d9890; stroke-width: 1.5; fill: none; stroke-dasharray: 6 6; }
  .sticker { fill: #f2efe9; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#d6d2cb"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9d9890"/>
    </marker>
  </defs>

  <!-- header -->
  <g transform="translate(60 34)">
    <g transform="rotate(-4 26 26)"><path fill="#f2efe9" transform="translate(1.6 46.5) scale(0.0683 -0.0683)" d="M709 180Q685 137 646.0 113.5Q607 90 560.0 74.5Q513 59 461.5 47.0Q410 35 362 16Q348 16 337.5 15.0Q327 14 317.5 12.5Q308 11 299.0 9.5Q290 8 279 7Q275 8 274.0 5.5Q273 3 271 1Q254 -2 240.5 -2.0Q227 -2 218 -2Q206 -2 193.5 -5.5Q181 -9 171 -8Q96 -4 53.5 45.5Q11 95 6 183Q7 188 4.5 189.0Q2 190 0 192Q0 202 2.5 209.0Q5 216 3 227Q29 282 62.0 329.5Q95 377 141 413Q148 419 153.0 425.0Q158 431 162.5 437.0Q167 443 173.0 447.5Q179 452 188 454Q209 478 238.0 498.0Q267 518 299.0 536.5Q331 555 362.5 573.5Q394 592 420 615Q431 610 436.0 612.0Q441 614 447 612Q454 597 466.5 591.0Q479 585 491.5 578.5Q504 572 515.0 563.0Q526 554 532 539Q526 539 526.5 534.5Q527 530 529.0 525.5Q531 521 530.5 516.5Q530 512 523 512Q524 507 529.5 506.5Q535 506 535 501Q535 496 532.5 493.0Q530 490 532 483Q512 470 487.5 458.0Q463 446 436.5 432.5Q410 419 381.5 403.5Q353 388 326 368Q299 348 271.0 323.5Q243 299 217.0 272.0Q191 245 168.0 216.5Q145 188 129 160Q131 155 133.5 152.5Q136 150 138 145Q170 143 197.5 145.5Q225 148 253 142Q256 144 257.0 148.0Q258 152 262 154Q319 160 368.0 172.5Q417 185 468 199Q460 202 453.5 204.5Q447 207 441 209Q436 214 441.5 217.5Q447 221 451 225Q437 233 428.5 245.0Q420 257 418 277Q424 282 424.0 289.0Q424 296 418 300Q414 301 413.0 300.0Q412 299 411.5 297.0Q411 295 410.0 293.5Q409 292 405 294Q406 303 409.5 309.0Q413 315 415 323L484 369Q495 361 511.0 351.5Q527 342 544.5 332.5Q562 323 580.5 313.5Q599 304 615 295Q629 289 640.0 279.0Q651 269 661.0 258.5Q671 248 681.5 238.0Q692 228 706 221Q704 208 707.0 200.0Q710 192 709 180Z"/></g>
    <text class="marker" x="72" y="46" font-size="42">goyaah</text>
  </g>
  <text class="s" x="1340" y="64" text-anchor="end">How a call runs</text>

  <!-- every 80 ms -->
  <text class="h" x="60" y="150">Every 80 ms, for the whole call</text>
  <text class="s" x="60" y="180">One model step per frame. Audio goes in and comes out at the same time, so there are no turns.</text>

  <rect class="box" x="60" y="230" width="180" height="100" rx="12"/>
  <text class="t" x="150" y="275" text-anchor="middle">Your mic</text>
  <text class="s" x="150" y="303" text-anchor="middle">24 kHz</text>
  <line class="line" x1="240" y1="280" x2="288" y2="280" marker-end="url(#a)"/>

  <rect class="box" x="290" y="230" width="200" height="100" rx="12"/>
  <text class="t" x="390" y="275" text-anchor="middle">Mimi encoder</text>
  <text class="s" x="390" y="303" text-anchor="middle">80 ms of audio to 8 codes</text>
  <line class="line" x1="490" y1="280" x2="538" y2="280" marker-end="url(#a)"/>

  <rect class="big" x="540" y="215" width="320" height="130" rx="14"/>
  <text class="T" x="700" y="263" text-anchor="middle">Goyaah 7B</text>
  <text class="c" x="700" y="293" text-anchor="middle">4-bit weights, on MLX</text>
  <text class="s" x="700" y="320" text-anchor="middle">32 + 6 transformer layers</text>
  <line class="line" x1="860" y1="280" x2="908" y2="280" marker-end="url(#a)"/>

  <rect class="box" x="910" y="230" width="200" height="100" rx="12"/>
  <text class="t" x="1010" y="275" text-anchor="middle">Mimi decoder</text>
  <text class="s" x="1010" y="303" text-anchor="middle">8 codes to 80 ms of audio</text>
  <line class="line" x1="1110" y1="280" x2="1158" y2="280" marker-end="url(#a)"/>

  <rect class="box" x="1160" y="230" width="180" height="100" rx="12"/>
  <text class="t" x="1250" y="275" text-anchor="middle">Speaker</text>
  <text class="s" x="1250" y="303" text-anchor="middle">headphones</text>

  <!-- the loop -->
  <path class="dash" d="M800 345V385H600V349" marker-end="url(#ad)"/>
  <text class="s" x="700" y="412" text-anchor="middle">its own last frame comes back in, so it hears itself and you at once</text>

  <!-- numbers -->
  <g transform="translate(60 447) rotate(-2)">
    <rect class="sticker" width="215" height="40" rx="4"/>
    <text class="marker k" x="107" y="27" text-anchor="middle">80 ms in, 80 ms out</text>
  </g>
  <g transform="translate(555 447) rotate(1.5)">
    <rect class="sticker" width="290" height="40" rx="4"/>
    <text class="marker k" x="145" y="27" text-anchor="middle">26 ms a step on an M4 Pro</text>
  </g>
  <g transform="translate(1140 447) rotate(-1.5)">
    <rect class="sticker" width="200" height="40" rx="4"/>
    <text class="marker k" x="100" y="27" text-anchor="middle">7 GB of memory</text>
  </g>

  <!-- before the call -->
  <text class="h" x="60" y="560">Before the call: the persona</text>
  <text class="s" x="60" y="590">A voice sample and a text prompt, pushed through the model before you speak.</text>

  <rect class="band" x="60" y="612" width="300" height="56" rx="8"/>
  <text class="c" x="210" y="646" text-anchor="middle">voice sample, one of 18</text>
  <rect class="band" x="375" y="612" width="560" height="56" rx="8"/>
  <text class="c" x="655" y="646" text-anchor="middle">&lt;system&gt; You are Jess, a frank film nerd … &lt;system&gt;</text>
  <rect class="band on" x="950" y="612" width="390" height="56" rx="8"/>
  <text class="k" x="1145" y="646" text-anchor="middle" font-weight="500">the call, one step per 80 ms</text>

  <text class="s" x="60" y="705">Nothing in the prompt is sampled, so Goyaah pushes it through in two batched passes. The call starts in 1.1 s instead of 6.7.</text>

  <!-- footer -->
  <text class="s" x="1340" y="745" text-anchor="end">Weights: NVIDIA PersonaPlex 7B, fine-tuned from Kyutai Moshi, quantized to 4-bit. Codec: Kyutai Mimi. Engine and app: Goyaah, MIT.</text>
</svg>
</body>
</html>
